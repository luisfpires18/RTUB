<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Canhão (cannon/bomb) -->
  <defs>
    <linearGradient id="bombGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#616161"/>
      <stop offset="100%" stop-color="#212121"/>
    </linearGradient>
    <radialGradient id="bombShine" cx="35%" cy="35%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="fireGrad" cx="50%" cy="80%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#f44336"/>
    </radialGradient>
  </defs>
  <!-- Bomb body -->
  <circle cx="32" cy="36" r="20" fill="url(#bombGrad)" stroke="#111" stroke-width="1.5"/>
  <circle cx="32" cy="36" r="20" fill="url(#bombShine)"/>
  <!-- Fuse tube -->
  <rect x="29" y="10" width="6" height="10" rx="2" fill="#424242" stroke="#111" stroke-width="1"/>
  <!-- Fuse string -->
  <path d="M32 10 Q38 4 34 0" stroke="#8d6e63" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Spark/fire at fuse tip -->
  <circle cx="34" cy="0" r="5" fill="url(#fireGrad)" opacity="0.9"/>
  <circle cx="34" cy="0" r="3" fill="#fff176" opacity="0.7"/>
  <!-- Highlight on bomb -->
  <ellipse cx="26" cy="30" rx="4" ry="6" fill="rgba(255,255,255,0.15)" transform="rotate(-20 26 30)"/>
  <!-- Skull/danger mark -->
  <text x="32" y="40" text-anchor="middle" font-size="14" fill="#ef5350" font-weight="bold" opacity="0.7">☠</text>
</svg>
