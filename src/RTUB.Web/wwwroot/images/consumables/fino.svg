<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fino (small beer glass) -->
  <defs>
    <linearGradient id="beerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#c68a17"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
  </defs>
  <!-- Glass body -->
  <path d="M18 12 L16 52 Q16 56 20 56 L44 56 Q48 56 48 52 L46 12 Z" fill="url(#beerGrad)" stroke="#a06a10" stroke-width="1.5"/>
  <!-- Glass shine -->
  <path d="M20 14 L19 50 Q19 53 22 53 L26 53 L28 14 Z" fill="url(#glassGrad)"/>
  <!-- Foam top -->
  <ellipse cx="32" cy="12" rx="15" ry="5" fill="#fff8e0" stroke="#ddc880" stroke-width="1"/>
  <circle cx="25" cy="10" r="3" fill="#fffbe8" opacity="0.8"/>
  <circle cx="35" cy="9" r="4" fill="#fffbe8" opacity="0.7"/>
  <circle cx="30" cy="11" r="2.5" fill="#fffbe8" opacity="0.9"/>
  <!-- Bubbles -->
  <circle cx="28" cy="35" r="1.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="36" cy="28" r="1" fill="rgba(255,255,255,0.3)"/>
  <circle cx="32" cy="42" r="1.2" fill="rgba(255,255,255,0.35)"/>
</svg>
