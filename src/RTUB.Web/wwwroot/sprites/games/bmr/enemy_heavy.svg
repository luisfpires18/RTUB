<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 64">
  <!-- Heavy enemy (feminine face), body preserved -->

  <!-- Body (unchanged) -->
  <ellipse cx="26" cy="44" rx="22" ry="18" fill="#c71585"/>
  <ellipse cx="26" cy="44" rx="19" ry="15" fill="#db7093"/>

  <!-- Dress pattern (unchanged) -->
  <circle cx="16" cy="40" r="3" fill="#8b008b" opacity="0.5"/>
  <circle cx="36" cy="40" r="3" fill="#8b008b" opacity="0.5"/>
  <circle cx="26" cy="48" r="3" fill="#8b008b" opacity="0.5"/>
  <circle cx="18" cy="52" r="2.5" fill="#8b008b" opacity="0.5"/>
  <circle cx="34" cy="52" r="2.5" fill="#8b008b" opacity="0.5"/>
  <circle cx="26" cy="36" r="2.5" fill="#8b008b" opacity="0.5"/>

  <!-- Head -->
  <circle cx="26" cy="18" r="14" fill="#f5deb3"/>

  <!-- Hair (messy top + longer sides) -->
  <ellipse cx="26" cy="6" rx="14" ry="7" fill="#4a2c2a"/>
  <circle cx="14" cy="12" r="6" fill="#4a2c2a"/>
  <circle cx="38" cy="12" r="6" fill="#4a2c2a"/>
  <circle cx="20" cy="5" r="5" fill="#4a2c2a"/>
  <circle cx="32" cy="5" r="5" fill="#4a2c2a"/>

  <!-- Side hair to frame face -->
  <path d="M12,12 Q6,22 10,34 Q15,30 15,18 Q15,14 12,12 Z" fill="#4a2c2a"/>
  <path d="M40,12 Q46,22 42,34 Q37,30 37,18 Q37,14 40,12 Z" fill="#4a2c2a"/>

  <!-- Earrings -->
  <circle cx="12" cy="22" r="1.8" fill="#ffd700"/>
  <circle cx="40" cy="22" r="1.8" fill="#ffd700"/>

  <!-- Eyes (kept size, add lashes/liner) -->
  <circle cx="20" cy="16" r="3" fill="white"/>
  <circle cx="32" cy="16" r="3" fill="white"/>
  <circle cx="21" cy="16" r="1.4" fill="#333"/>
  <circle cx="33" cy="16" r="1.4" fill="#333"/>

  <!-- Eyelashes -->
  <line x1="17.5" y1="14.2" x2="16.2" y2="13.0" stroke="#4a2c2a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="20" y1="13.8" x2="20" y2="12.2" stroke="#4a2c2a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22.5" y1="14.2" x2="23.8" y2="13.0" stroke="#4a2c2a" stroke-width="1.2" stroke-linecap="round"/>

  <line x1="29.5" y1="14.2" x2="28.2" y2="13.0" stroke="#4a2c2a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="32" y1="13.8" x2="32" y2="12.2" stroke="#4a2c2a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="34.5" y1="14.2" x2="35.8" y2="13.0" stroke="#4a2c2a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Brows (arched, still a bit stern) -->
  <path d="M15,11 Q20,8 25,11" fill="none" stroke="#4a2c2a" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M37,11 Q32,8 27,11" fill="none" stroke="#4a2c2a" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Lipstick mouth (smirky/mean) -->
  <path d="M19,25 Q26,30 33,25 Q26,27 19,25 Z" fill="#c2185b" stroke="#8b4513" stroke-width="1.2"/>

  <!-- Blush -->
  <ellipse cx="13" cy="20" rx="4" ry="2.5" fill="#ffb6c1" opacity="0.5"/>
  <ellipse cx="39" cy="20" rx="4" ry="2.5" fill="#ffb6c1" opacity="0.5"/>

  <!-- Feet (unchanged) -->
  <ellipse cx="16" cy="62" rx="7" ry="3" fill="#c71585"/>
  <ellipse cx="36" cy="62" rx="7" ry="3" fill="#c71585"/>
</svg>
