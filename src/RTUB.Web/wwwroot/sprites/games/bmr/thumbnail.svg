<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a1a"/>
      <stop offset="50%" style="stop-color:#2a5a2a"/>
      <stop offset="100%" style="stop-color:#3a7a3a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="280" height="180" fill="url(#bg)"/>
  
  <!-- Ground -->
  <rect x="0" y="140" width="280" height="40" fill="#5d4e37"/>
  <rect x="0" y="138" width="280" height="4" fill="#7a6f5a"/>
  
  <!-- Platform -->
  <rect x="80" y="100" width="60" height="10" fill="#8b7355" rx="2"/>
  <rect x="180" y="70" width="50" height="10" fill="#8b7355" rx="2"/>
  
  <!-- Borat (Player) -->
  <g transform="translate(30, 90)">
    <!-- Body -->
    <rect x="8" y="20" width="24" height="30" rx="3" fill="#2ecc71"/>
    <!-- Head -->
    <circle cx="20" cy="12" r="12" fill="#f5deb3"/>
    <!-- Mustache -->
    <path d="M12,16 Q20,22 28,16" fill="#333" stroke="#333" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="15" cy="10" r="2" fill="#333"/>
    <circle cx="25" cy="10" r="2" fill="#333"/>
    <!-- Hair -->
    <path d="M8,8 Q20,0 32,8" fill="#333" stroke="#333" stroke-width="3"/>
    <!-- Legs -->
    <rect x="10" y="48" width="6" height="15" fill="#3498db"/>
    <rect x="24" y="48" width="6" height="15" fill="#3498db"/>
  </g>
  
  <!-- Beer -->
  <g transform="translate(120, 85)">
    <rect x="0" y="5" width="15" height="20" rx="2" fill="#f4a460"/>
    <rect x="0" y="5" width="15" height="6" fill="#fff" opacity="0.8"/>
    <rect x="12" y="8" width="4" height="12" rx="2" fill="#f4a460"/>
  </g>
  
  <!-- Fat Lady (Enemy) -->
  <g transform="translate(200, 45)">
    <ellipse cx="15" cy="25" rx="18" ry="20" fill="#ff69b4"/>
    <circle cx="15" cy="8" r="10" fill="#f5deb3"/>
    <circle cx="12" cy="6" r="1.5" fill="#333"/>
    <circle cx="18" cy="6" r="1.5" fill="#333"/>
    <path d="M10,12 Q15,15 20,12" fill="none" stroke="#333" stroke-width="1"/>
    <ellipse cx="15" cy="2" rx="8" ry="4" fill="#8b4513"/>
  </g>
  
  <!-- Title -->
  <text x="140" y="170" font-family="Arial" font-size="11" fill="white" text-anchor="middle" font-weight="bold">BMR — Bebe mais Rui</text>
</svg>
