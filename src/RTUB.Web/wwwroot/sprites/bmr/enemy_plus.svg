<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 56">
  <!-- Plus - Medium Fat Lady enemy -->
  <!-- Body (bigger than chubby) -->
  <ellipse cx="22" cy="38" rx="18" ry="16" fill="#ff1493"/>
  <ellipse cx="22" cy="38" rx="15" ry="13" fill="#ff69b4"/>
  
  <!-- Dress pattern -->
  <circle cx="14" cy="35" r="2.5" fill="#c71585" opacity="0.5"/>
  <circle cx="30" cy="35" r="2.5" fill="#c71585" opacity="0.5"/>
  <circle cx="22" cy="42" r="2.5" fill="#c71585" opacity="0.5"/>
  <circle cx="16" cy="44" r="2" fill="#c71585" opacity="0.5"/>
  <circle cx="28" cy="44" r="2" fill="#c71585" opacity="0.5"/>
  
  <!-- Head -->
  <circle cx="22" cy="16" r="12" fill="#f5deb3"/>
  
  <!-- Hair (bigger, curlier) -->
  <ellipse cx="22" cy="6" rx="12" ry="6" fill="#654321"/>
  <circle cx="12" cy="10" r="5" fill="#654321"/>
  <circle cx="32" cy="10" r="5" fill="#654321"/>
  <circle cx="22" cy="4" r="4" fill="#654321"/>
  
  <!-- Eyes -->
  <circle cx="17" cy="14" r="2.5" fill="white"/>
  <circle cx="27" cy="14" r="2.5" fill="white"/>
  <circle cx="17" cy="14" r="1.2" fill="#333"/>
  <circle cx="27" cy="14" r="1.2" fill="#333"/>
  
  <!-- Angry eyebrows (thicker) -->
  <line x1="13" y1="9" x2="20" y2="11" stroke="#654321" stroke-width="2.5"/>
  <line x1="31" y1="9" x2="24" y2="11" stroke="#654321" stroke-width="2.5"/>
  
  <!-- Mouth (angrier frown) -->
  <path d="M16,22 Q22,18 28,22" fill="none" stroke="#8b4513" stroke-width="2"/>
  
  <!-- Blush -->
  <ellipse cx="12" cy="18" rx="3" ry="2" fill="#ffb6c1" opacity="0.6"/>
  <ellipse cx="32" cy="18" rx="3" ry="2" fill="#ffb6c1" opacity="0.6"/>
  
  <!-- Feet -->
  <ellipse cx="14" cy="54" rx="6" ry="3" fill="#ff1493"/>
  <ellipse cx="30" cy="54" rx="6" ry="3" fill="#ff1493"/>
</svg>
