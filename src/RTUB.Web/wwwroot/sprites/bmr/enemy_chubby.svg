<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 48">
  <!-- Chubby - Smallest Fat Lady enemy -->
  <!-- Body -->
  <ellipse cx="18" cy="32" rx="14" ry="14" fill="#ff69b4"/>
  <ellipse cx="18" cy="32" rx="12" ry="12" fill="#ff85c1"/>
  
  <!-- Dress pattern -->
  <circle cx="12" cy="30" r="2" fill="#ff1493" opacity="0.5"/>
  <circle cx="24" cy="30" r="2" fill="#ff1493" opacity="0.5"/>
  <circle cx="18" cy="36" r="2" fill="#ff1493" opacity="0.5"/>
  
  <!-- Head -->
  <circle cx="18" cy="14" r="10" fill="#f5deb3"/>
  
  <!-- Hair (curly) -->
  <ellipse cx="18" cy="6" rx="10" ry="5" fill="#8b4513"/>
  <circle cx="10" cy="8" r="4" fill="#8b4513"/>
  <circle cx="26" cy="8" r="4" fill="#8b4513"/>
  
  <!-- Eyes -->
  <circle cx="14" cy="12" r="2" fill="white"/>
  <circle cx="22" cy="12" r="2" fill="white"/>
  <circle cx="14" cy="12" r="1" fill="#333"/>
  <circle cx="22" cy="12" r="1" fill="#333"/>
  
  <!-- Angry eyebrows -->
  <line x1="11" y1="8" x2="17" y2="10" stroke="#8b4513" stroke-width="2"/>
  <line x1="25" y1="8" x2="19" y2="10" stroke="#8b4513" stroke-width="2"/>
  
  <!-- Mouth (frown) -->
  <path d="M14,18 Q18,15 22,18" fill="none" stroke="#a0522d" stroke-width="1.5"/>
  
  <!-- Feet -->
  <ellipse cx="12" cy="46" rx="5" ry="3" fill="#ff69b4"/>
  <ellipse cx="24" cy="46" rx="5" ry="3" fill="#ff69b4"/>
</svg>
