<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 64">
  <!-- Heavy - Large Fat Lady enemy -->
  <!-- Body (much bigger) -->
  <ellipse cx="26" cy="44" rx="22" ry="18" fill="#c71585"/>
  <ellipse cx="26" cy="44" rx="19" ry="15" fill="#db7093"/>
  
  <!-- Dress pattern (more dots) -->
  <circle cx="16" cy="40" r="3" fill="#8b008b" opacity="0.5"/>
  <circle cx="36" cy="40" r="3" fill="#8b008b" opacity="0.5"/>
  <circle cx="26" cy="48" r="3" fill="#8b008b" opacity="0.5"/>
  <circle cx="18" cy="52" r="2.5" fill="#8b008b" opacity="0.5"/>
  <circle cx="34" cy="52" r="2.5" fill="#8b008b" opacity="0.5"/>
  <circle cx="26" cy="36" r="2.5" fill="#8b008b" opacity="0.5"/>
  
  <!-- Head -->
  <circle cx="26" cy="18" r="14" fill="#f5deb3"/>
  
  <!-- Hair (big, messy) -->
  <ellipse cx="26" cy="6" rx="14" ry="7" fill="#4a2c2a"/>
  <circle cx="14" cy="12" r="6" fill="#4a2c2a"/>
  <circle cx="38" cy="12" r="6" fill="#4a2c2a"/>
  <circle cx="20" cy="5" r="5" fill="#4a2c2a"/>
  <circle cx="32" cy="5" r="5" fill="#4a2c2a"/>
  
  <!-- Eyes (smaller, meaner) -->
  <circle cx="20" cy="16" r="3" fill="white"/>
  <circle cx="32" cy="16" r="3" fill="white"/>
  <circle cx="21" cy="16" r="1.5" fill="#333"/>
  <circle cx="33" cy="16" r="1.5" fill="#333"/>
  
  <!-- Very angry eyebrows -->
  <line x1="15" y1="10" x2="24" y2="13" stroke="#4a2c2a" stroke-width="3"/>
  <line x1="37" y1="10" x2="28" y2="13" stroke="#4a2c2a" stroke-width="3"/>
  
  <!-- Mouth (very angry) -->
  <path d="M19,26 Q26,21 33,26" fill="none" stroke="#8b4513" stroke-width="2.5"/>
  <line x1="17" y1="25" x2="19" y2="26" stroke="#8b4513" stroke-width="2"/>
  <line x1="35" y1="25" x2="33" y2="26" stroke="#8b4513" stroke-width="2"/>
  
  <!-- Blush -->
  <ellipse cx="13" cy="20" rx="4" ry="2.5" fill="#ffb6c1" opacity="0.5"/>
  <ellipse cx="39" cy="20" rx="4" ry="2.5" fill="#ffb6c1" opacity="0.5"/>
  
  <!-- Feet -->
  <ellipse cx="16" cy="62" rx="7" ry="3" fill="#c71585"/>
  <ellipse cx="36" cy="62" rx="7" ry="3" fill="#c71585"/>
</svg>
