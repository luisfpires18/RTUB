<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 56">
  <!-- Plus enemy (feminine pass) - body preserved -->
  <!-- Body (bigger than chubby) -->
  <ellipse cx="22" cy="38" rx="18" ry="16" fill="#ff1493"/>
  <ellipse cx="22" cy="38" rx="15" ry="13" fill="#ff69b4"/>
  
  <!-- Dress pattern -->
  <circle cx="14" cy="35" r="2.5" fill="#c71585" opacity="0.5"/>
  <circle cx="30" cy="35" r="2.5" fill="#c71585" opacity="0.5"/>
  <circle cx="22" cy="42" r="2.5" fill="#c71585" opacity="0.5"/>
  <circle cx="16" cy="44" r="2" fill="#c71585" opacity="0.5"/>
  <circle cx="28" cy="44" r="2" fill="#c71585" opacity="0.5"/>
  
  <!-- Head -->
  <circle cx="22" cy="16" r="12" fill="#f5deb3"/>
  
  <!-- Hair (bigger, curlier) -->
  <ellipse cx="22" cy="6" rx="12" ry="6" fill="#654321"/>
  <circle cx="12" cy="10" r="5" fill="#654321"/>
  <circle cx="32" cy="10" r="5" fill="#654321"/>
  <circle cx="22" cy="4" r="4" fill="#654321"/>
  
  <!-- Earrings -->
  <circle cx="10.5" cy="18" r="1.4" fill="#f2c14e"/>
  <circle cx="33.5" cy="18" r="1.4" fill="#f2c14e"/>
  <circle cx="10.0" cy="17.5" r="0.45" fill="#fff" opacity="0.8"/>
  <circle cx="33.0" cy="17.5" r="0.45" fill="#fff" opacity="0.8"/>
  
  <!-- Eyes -->
  <circle cx="17" cy="14" r="2.5" fill="white"/>
  <circle cx="27" cy="14" r="2.5" fill="white"/>
  <circle cx="17" cy="14" r="1.2" fill="#333"/>
  <circle cx="27" cy="14" r="1.2" fill="#333"/>
  
  <!-- Eyelashes (small) -->
  <line x1="15.6" y1="12.6" x2="16.6" y2="13.2" stroke="#333" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="17" y1="12.25" x2="17" y2="13.0" stroke="#333" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="18.4" y1="12.6" x2="17.4" y2="13.2" stroke="#333" stroke-width="0.7" stroke-linecap="round"/>

  <line x1="25.6" y1="12.6" x2="26.6" y2="13.2" stroke="#333" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="27" y1="12.25" x2="27" y2="13.0" stroke="#333" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="28.4" y1="12.6" x2="27.4" y2="13.2" stroke="#333" stroke-width="0.7" stroke-linecap="round"/>
  
  <!-- Eyebrows (arched) -->
  <path d="M12.8 10.2 Q17 8.2 21.2 10.2" fill="none" stroke="#654321" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M22.8 10.2 Q27 8.2 31.2 10.2" fill="none" stroke="#654321" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- Lips -->
  <path d="M16 22 Q22 25 28 22 Q22 23.2 16 22 Z" fill="#d12c2c" opacity="0.95"/>
  
  <!-- Blush -->
  <ellipse cx="12" cy="18" rx="3" ry="2" fill="#ffb6c1" opacity="0.6"/>
  <ellipse cx="32" cy="18" rx="3" ry="2" fill="#ffb6c1" opacity="0.6"/>
  
  <!-- Feet -->
  <ellipse cx="14" cy="54" rx="6" ry="3" fill="#ff1493"/>
  <ellipse cx="30" cy="54" rx="6" ry="3" fill="#ff1493"/>
</svg>
