<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 48">
  <!-- Chubby enemy (feminine pass) - body preserved -->

  <!-- Hair: back mass (behind head) -->
  <path d="M8 12
           C7 7 11 3 18 3
           C25 3 29 7 28 12
           C30 14 31 18 29 22
           C27 26 23 27 21 25
           C20 22 19 20 18 20
           C17 20 16 22 15 25
           C13 27 9 26 7 22
           C5 18 6 14 8 12 Z"
        fill="#6f3b1f"/>

  <!-- Body -->
  <ellipse cx="18" cy="32" rx="14" ry="14" fill="#ff69b4"/>
  <ellipse cx="18" cy="32" rx="12" ry="12" fill="#ff85c1"/>

  <!-- Dress neckline & belt (subtle) -->
  <path d="M12 22 Q18 26 24 22" fill="none" stroke="#ff1493" stroke-width="1.5" opacity="0.7"/>
  <rect x="9" y="31" width="18" height="2" rx="1" fill="#ff1493" opacity="0.55"/>

  <!-- Dress pattern -->
  <circle cx="12" cy="30" r="2" fill="#ff1493" opacity="0.5"/>
  <circle cx="24" cy="30" r="2" fill="#ff1493" opacity="0.5"/>
  <circle cx="18" cy="36" r="2" fill="#ff1493" opacity="0.5"/>

  <!-- Head -->
  <circle cx="18" cy="14" r="10" fill="#f5deb3"/>

  <!-- Hair: bangs + side curls (front) -->
  <path d="M8 11
           C10 6 14 4 18 4
           C22 4 26 6 28 11
           C25 10 23 10 21 11
           C20 8 19 7 18 7
           C17 7 16 8 15 11
           C13 10 11 10 8 11 Z"
        fill="#8b4513"/>
  <circle cx="10" cy="15" r="3.6" fill="#8b4513"/>
  <circle cx="26" cy="15" r="3.6" fill="#8b4513"/>

  <!-- Earrings -->
  <circle cx="8.5" cy="15" r="1" fill="#f2c14e"/>
  <circle cx="27.5" cy="15" r="1" fill="#f2c14e"/>

  <!-- Eyes -->
  <circle cx="14" cy="12" r="2" fill="white"/>
  <circle cx="22" cy="12" r="2" fill="white"/>
  <circle cx="14" cy="12" r="1" fill="#333"/>
  <circle cx="22" cy="12" r="1" fill="#333"/>

  <!-- Eyelashes (small) -->
  <line x1="12.7" y1="10.7" x2="13.6" y2="11.2" stroke="#333" stroke-width="0.6"/>
  <line x1="14" y1="10.4" x2="14" y2="11.0" stroke="#333" stroke-width="0.6"/>
  <line x1="15.3" y1="10.7" x2="14.4" y2="11.2" stroke="#333" stroke-width="0.6"/>

  <line x1="20.7" y1="10.7" x2="21.6" y2="11.2" stroke="#333" stroke-width="0.6"/>
  <line x1="22" y1="10.4" x2="22" y2="11.0" stroke="#333" stroke-width="0.6"/>
  <line x1="23.3" y1="10.7" x2="22.4" y2="11.2" stroke="#333" stroke-width="0.6"/>

  <!-- Eyebrows (arched, less angry) -->
  <path d="M11.5 9.5 Q14 8 16.5 9.5" fill="none" stroke="#6f3b1f" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M19.5 9.5 Q22 8 24.5 9.5" fill="none" stroke="#6f3b1f" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Blush -->
  <circle cx="11.5" cy="16" r="2.2" fill="#ff4fa3" opacity="0.25"/>
  <circle cx="24.5" cy="16" r="2.2" fill="#ff4fa3" opacity="0.25"/>

  <!-- Lips -->
  <path d="M14 18
           Q18 21 22 18
           Q18 19 14 18 Z"
        fill="#d12c2c" opacity="0.95"/>

  <!-- Feet -->
  <ellipse cx="12" cy="46" rx="5" ry="3" fill="#ff69b4"/>
  <ellipse cx="24" cy="46" rx="5" ry="3" fill="#ff69b4"/>
</svg>
