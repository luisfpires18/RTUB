<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="40%" style="stop-color:#2d5a7b"/>
      <stop offset="100%" style="stop-color:#4a7a9a"/>
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>
  
  <!-- Stars -->
  <circle cx="50" cy="50" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="80" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="250" cy="40" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="350" cy="90" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="450" cy="60" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="550" cy="30" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="650" cy="70" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="750" cy="50" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="100" cy="120" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="200" cy="150" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="400" cy="130" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="600" cy="140" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="700" cy="110" r="1.2" fill="#fff" opacity="0.6"/>
  
  <!-- Moon -->
  <circle cx="680" cy="80" r="40" fill="#f5f5dc"/>
  <circle cx="695" cy="75" r="35" fill="url(#sky)"/>
  
  <!-- Distant mountains -->
  <polygon points="0,400 100,300 200,350 300,280 400,340 500,290 600,350 700,300 800,380 800,450 0,450" fill="#2a4a3a"/>
  <polygon points="0,420 80,350 160,380 240,320 320,370 400,310 480,360 560,300 640,370 720,330 800,400 800,470 0,470" fill="#3a5a4a"/>
  
  <!-- Hills -->
  <ellipse cx="100" cy="500" rx="200" ry="80" fill="#4a6a5a"/>
  <ellipse cx="400" cy="520" rx="250" ry="100" fill="#3a5a4a"/>
  <ellipse cx="700" cy="500" rx="200" ry="80" fill="#4a6a5a"/>
  
  <!-- Ground -->
  <rect x="0" y="520" width="800" height="80" fill="#5a7a6a"/>
  <rect x="0" y="516" width="800" height="8" fill="#6a8a7a"/>
  
  <!-- Grass tufts -->
  <path d="M20,520 L25,510 L30,520" fill="#7a9a8a"/>
  <path d="M80,520 L85,508 L90,520" fill="#7a9a8a"/>
  <path d="M150,520 L155,512 L160,520" fill="#7a9a8a"/>
  <path d="M220,520 L225,509 L230,520" fill="#7a9a8a"/>
  <path d="M300,520 L305,511 L310,520" fill="#7a9a8a"/>
  <path d="M380,520 L385,508 L390,520" fill="#7a9a8a"/>
  <path d="M460,520 L465,512 L470,520" fill="#7a9a8a"/>
  <path d="M540,520 L545,509 L550,520" fill="#7a9a8a"/>
  <path d="M620,520 L625,510 L630,520" fill="#7a9a8a"/>
  <path d="M700,520 L705,508 L710,520" fill="#7a9a8a"/>
  <path d="M780,520 L785,511 L790,520" fill="#7a9a8a"/>
</svg>
