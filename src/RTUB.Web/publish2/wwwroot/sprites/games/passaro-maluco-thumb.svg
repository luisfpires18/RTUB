<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <!-- Background sky gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
    <radialGradient id="birdGrad" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#fce38a"/>
      <stop offset="100%" stop-color="#f7dc6f"/>
    </radialGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="300" height="200" fill="url(#skyGradient)"/>
  
  <!-- Clouds -->
  <ellipse cx="50" cy="40" rx="30" ry="15" fill="white" opacity="0.8"/>
  <ellipse cx="75" cy="35" rx="25" ry="12" fill="white" opacity="0.8"/>
  <ellipse cx="220" cy="60" rx="35" ry="18" fill="white" opacity="0.7"/>
  <ellipse cx="250" cy="55" rx="28" ry="14" fill="white" opacity="0.7"/>
  
  <!-- Ground -->
  <rect x="0" y="180" width="300" height="20" fill="#8b7355"/>
  <rect x="0" y="175" width="300" height="8" fill="#90ee90"/>
  
  <!-- Left Pipe (bottom part) -->
  <rect x="60" y="120" width="40" height="60" fill="#73bf2e"/>
  <rect x="60" y="120" width="8" height="60" fill="#8fd14f"/>
  <rect x="92" y="120" width="8" height="60" fill="#5a9b24"/>
  <rect x="55" y="120" width="50" height="20" fill="#73bf2e"/>
  <rect x="55" y="120" width="8" height="20" fill="#8fd14f"/>
  <rect x="97" y="120" width="8" height="20" fill="#5a9b24"/>
  
  <!-- Left Pipe (top part) -->
  <rect x="60" y="0" width="40" height="60" fill="#73bf2e"/>
  <rect x="60" y="0" width="8" height="60" fill="#8fd14f"/>
  <rect x="92" y="0" width="8" height="60" fill="#5a9b24"/>
  <rect x="55" y="55" width="50" height="20" fill="#73bf2e"/>
  <rect x="55" y="55" width="8" height="20" fill="#8fd14f"/>
  <rect x="97" y="55" width="8" height="20" fill="#5a9b24"/>
  
  <!-- Right Pipe (bottom part) -->
  <rect x="200" y="140" width="40" height="40" fill="#73bf2e"/>
  <rect x="200" y="140" width="8" height="40" fill="#8fd14f"/>
  <rect x="232" y="140" width="8" height="40" fill="#5a9b24"/>
  <rect x="195" y="140" width="50" height="20" fill="#73bf2e"/>
  <rect x="195" y="140" width="8" height="20" fill="#8fd14f"/>
  <rect x="237" y="140" width="8" height="20" fill="#5a9b24"/>
  
  <!-- Right Pipe (top part) -->
  <rect x="200" y="0" width="40" height="80" fill="#73bf2e"/>
  <rect x="200" y="0" width="8" height="80" fill="#8fd14f"/>
  <rect x="232" y="0" width="8" height="80" fill="#5a9b24"/>
  <rect x="195" y="75" width="50" height="20" fill="#73bf2e"/>
  <rect x="195" y="75" width="8" height="20" fill="#8fd14f"/>
  <rect x="237" y="75" width="8" height="20" fill="#5a9b24"/>
  
  <!-- Bird -->
  <g transform="translate(130, 85)">
    <!-- Body -->
    <ellipse cx="20" cy="22" rx="16" ry="14" fill="url(#birdGrad)"/>
    <!-- Wing -->
    <ellipse cx="14" cy="24" rx="8" ry="6" fill="#e8c547"/>
    <!-- Eye white -->
    <circle cx="26" cy="18" r="7" fill="white"/>
    <!-- Eye pupil -->
    <circle cx="28" cy="18" r="4" fill="#333"/>
    <circle cx="29" cy="16" r="1.5" fill="white"/>
    <!-- Beak -->
    <path d="M 32 22 L 40 24 L 32 26 Z" fill="#ff6b35"/>
    <!-- Belly -->
    <ellipse cx="22" cy="28" rx="8" ry="5" fill="#fef3c7" opacity="0.6"/>
  </g>
  
  <!-- Title -->
  <text x="150" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Passaro Maluco</text>
</svg>
