<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Caneca (large beer mug) -->
  <defs>
    <linearGradient id="mugBeer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="#b87a12"/>
    </linearGradient>
  </defs>
  <!-- Mug body -->
  <rect x="10" y="14" width="34" height="42" rx="4" fill="url(#mugBeer)" stroke="#8a5a0a" stroke-width="1.5"/>
  <!-- Mug shine -->
  <rect x="14" y="16" width="8" height="38" rx="2" fill="rgba(255,255,255,0.2)"/>
  <!-- Handle -->
  <path d="M44 22 Q56 22 56 34 Q56 46 44 46" fill="none" stroke="#8a5a0a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Foam top -->
  <rect x="8" y="10" width="38" height="8" rx="4" fill="#fff8e0" stroke="#ddc880" stroke-width="1"/>
  <circle cx="18" cy="12" r="3" fill="#fffbe8" opacity="0.8"/>
  <circle cx="28" cy="11" r="4" fill="#fffbe8" opacity="0.7"/>
  <circle cx="38" cy="12" r="3" fill="#fffbe8" opacity="0.75"/>
  <!-- Bubbles -->
  <circle cx="24" cy="36" r="1.5" fill="rgba(255,255,255,0.35)"/>
  <circle cx="32" cy="30" r="1" fill="rgba(255,255,255,0.3)"/>
  <circle cx="20" cy="44" r="1.2" fill="rgba(255,255,255,0.3)"/>
</svg>
