name: Deploy to Azure App Service

on:
  push:
    branches: [master]

# NOTE (Azure-side prerequisite): Basic Auth Publishing Credentials must be
# enabled on the App Service (Portal -> Configuration -> General settings ->
# "Basic Auth Publishing Credentials" = On) BEFORE a publish profile can be
# downloaded/used. If this is off, the publish-profile secret won't work
# even if it looks valid.

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node (for PixiJS bundle build during publish)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish
        run: dotnet publish src/RTUB.Web/RTUB.csproj --no-restore --configuration Release --output ./publish
        # dotnet publish's BeforePublish target runs `npm ci` + vite build for
        # the Pixi bundles automatically; output dir contains only the
        # framework-dependent runtime payload, not obj/ caches or NuGet/npm caches.

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: rtub
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
