name: CI • Build & Test

# Build and test only. Nothing here deploys.
#
#   pull_request -> dev / master   runs on its own, for the PR check
#   workflow_call                  Deploy • DEV and Deploy • PROD run it first, on the exact
#                                  commit they are about to package, and deploy only if it passes
#
# Branch model (docs/release-and-rollback.md):
#   feat/fix/chore -> dev -> Deploy • DEV            (automatic)
#   dev -> master         -> Deploy • PROD           (automatic; VERSION must go up)
#   master -> dev         after every production release, and after every hotfix
#   hotfix/* -> master    -> Deploy • PROD -> master back into dev

on:
  pull_request:
    branches: [dev, master]
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      # Also validates VERSION: Directory.Build.props fails the build unless it is
      # MAJOR.MINOR.PATCH.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Microsoft.Testing.Platform runner (see global.json "test.runner").
      # TRX comes from xUnit's built-in reporter; coverage from
      # Microsoft.Testing.Extensions.CodeCoverage. Report filenames are left
      # unset on purpose: all 5 projects write into one results directory and
      # MTP auto-assigns unique names, so a fixed name would overwrite.
      - name: Run tests with coverage
        run: |
          dotnet test --no-build --configuration Release \
            --results-directory ./coverage \
            --report-xunit-trx \
            --coverage --coverage-output-format cobertura

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage/**/*.cobertura.xml

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: coverage/**/*.trx

  # A pull request into master is a release (dev -> master) or a hotfix. Either way it becomes
  # a new production version, so VERSION must be higher than master's. Caught here, on the PR,
  # instead of after a ten-minute build on master. Deploy • PROD checks again on the push.
  version-bump:
    name: VERSION is bumped
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Compare with master
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          new=$(bash scripts/release.sh version)
          previous=$(gh api -H "Accept: application/vnd.github.raw+json" \
            "repos/$REPO/contents/VERSION?ref=$BASE_SHA" 2>/dev/null | tr -d '\r\n' || true)
          bash scripts/release.sh bump-check "${previous:--}" "$new"
