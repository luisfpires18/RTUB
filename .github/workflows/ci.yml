name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# NOTE (Azure-side prerequisite): Basic Auth Publishing Credentials must be
# enabled on the App Service (Portal -> Configuration -> General settings ->
# "Basic Auth Publishing Credentials" = On) BEFORE a publish profile can be
# downloaded/used. If this is off, the publish-profile secret won't work
# even if it looks valid.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node (for PixiJS bundle build during publish)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Microsoft.Testing.Platform runner (see global.json "test.runner").
      # TRX comes from xUnit's built-in reporter; coverage from
      # Microsoft.Testing.Extensions.CodeCoverage. Report filenames are left
      # unset on purpose: all 5 projects write into one results directory and
      # MTP auto-assigns unique names, so a fixed name would overwrite.
      - name: Run tests with coverage
        run: |
          dotnet test --no-build --configuration Release \
            --results-directory ./coverage \
            --report-xunit-trx \
            --coverage --coverage-output-format cobertura

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/**/*.cobertura.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: coverage/**/*.trx

      # Deploy only runs on a direct push to master (never on PRs), after
      # build+test above have already passed in this same job.
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish src/RTUB.Web/RTUB.csproj --no-restore --configuration Release --output ./publish
        # dotnet publish's BeforePublish target runs `npm ci` + vite build for
        # the Pixi bundles automatically; output dir contains only the
        # framework-dependent runtime payload, not obj/ caches or NuGet/npm caches.

      - name: Deploy to Azure App Service
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: azure/webapps-deploy@v3
        with:
          app-name: rtub
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
