name: Deploy • DEV

# Every push to dev (a merged PR included) deploys Azure DEV - rtub-dev and nothing else - once
# CI • Build & Test has passed on that exact commit. Never touches production.
#
#   CI • Build & Test -> package ONE zip -> deploy that zip -> smoke proves WHICH build answers
#
# DEV builds report <VERSION>-dev.<run number> on /api/version and are not archived: DEV has no
# rollback, you push again. See docs/ci-cd-and-azure-environments.md.

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  ci:
    name: CI • Build & Test
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Package (build once)
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact: ${{ steps.package.outputs.artifact }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Package
        id: package
        uses: ./.github/actions/package-release
        with:
          channel: dev

  deploy:
    name: Deploy rtub-dev
    needs: package
    runs-on: ubuntu-latest

    # Holds the non-secret Azure identifiers (AZURE_CLIENT_ID, AZURE_TENANT_ID,
    # AZURE_SUBSCRIPTION_ID) of the rtub-dev-deploy identity. No approval gate.
    environment:
      name: development
      url: https://rtub-dev.azurewebsites.net

    # id-token is what makes OIDC federation work. No publish profile, no client secret.
    permissions:
      id-token: write
      contents: read

    # Two dev pushes in quick succession queue instead of racing into the same App Service.
    # cancel-in-progress is deliberately FALSE: cancelling mid-upload would leave App Service
    # holding a half-transferred package.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            .github

      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: ${{ runner.temp }}/release

      - name: Verify it is the zip that was built
        env:
          VERSION: ${{ needs.package.outputs.version }}
          SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/release/rtub-$VERSION.zip"
          echo "$SHA256  $zip" | sha256sum -c -

      - name: Azure login (OIDC federated credential)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy and verify rtub-dev
        uses: ./.github/actions/deploy-and-verify
        with:
          app-name: rtub-dev
          package: ${{ runner.temp }}/release/rtub-${{ needs.package.outputs.version }}.zip
          expect-version: ${{ needs.package.outputs.version }}
          expect-commit: ${{ github.sha }}
